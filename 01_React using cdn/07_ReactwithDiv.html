<!DOCTYPE html>
<html lang="en">
<head>
     <title>My Fourth React Application</title>
    <script 
    crossorigin src="https://unpkg.com/react@18/umd/react.development.js">
</script>
<script 
crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
</script>
</head>
<body>
    <div id="root">

    </div>
    <script>
        function MyApp()
        {
            let myHeading= React.createElement("h1",{style:{color:"Blue",textAlign:"center"}}, "What is React");
            let myPar=React.createElement("p",{style:{color:"Green",textAlign:"center"}}, "React is component based JS labrary");
           let myDiv=React.createElement("div",{style:{border:"1px solid black",textAlign:"center"}},myHeading,myPar);
           return myDiv;
        }
      
       ReactDOM.render(React.createElement(MyApp),document.querySelector("#root"));

    </script>
</body>
</html>
