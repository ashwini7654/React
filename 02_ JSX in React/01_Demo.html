<!DOCTYPE html>
<html lang="en">
<head>
     <title>My First JSX </title>
    <script 
    crossorigin src="https://unpkg.com/react@18/umd/react.development.js">
</script>
<script 
crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root">

    </div>
    <script type="text/babel">
        function MyApp()
        {
            // let myElement= React.createElement("h1",null,"ReactRocks"); in place of this we use JSX in below line
            let myElement=<h1>ReactRocks</h1>;
           return myElement;
        }
    
       let myDiv=document.querySelector("#root");
       ReactDOM.render(React.createElement(MyApp),myDiv);

    </script>
</body>
</html>
