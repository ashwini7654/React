<!DOCTYPE html>
<html lang="en">
<head>
     <title>Object in JSX</title>
    <script 
    crossorigin src="https://unpkg.com/react@18/umd/react.development.js">
</script>
<script 
crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  
    <div id="root">

    </div>
    <script type="text/babel">
        function MyApp()
        {
             let actor={name:"Allu Arjun",hit:"Pushpa 2"}
       
          let myDiv=(<div>
          
               //<p>Actor name is {actor}</p>
               //React mein curly braces {} ke andar JavaScript expression likhte hain. Lekin React plain JavaScript object ko directly render nahi kar sakta.
               //object is not valid for React child. Isliye humne object ke properties ko access kiya hai jaise actor.name aur actor.hit.
               <p>Actor name is {actor.name}</p>
                <p>Famous movie is {actor.hit}</p>
               </div>);
           return myDiv;
        }
    
        ReactDOM.render(<MyApp/>,document.querySelector("#root"));


    </script>
</body>
</html>
