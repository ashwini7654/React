<!DOCTYPE html>
<html lang="en">
<head>
     <title>My  React With JSX Application to Dispaly Current Date and Time</title>
    <script 
    crossorigin src="https://unpkg.com/react@18/umd/react.development.js">
</script>
<script 
crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
    h1 {
        color: red;
    }
</style>
</head>
<body>
  
    <div id="root">

    </div>
    <script type="text/babel">
        function MyApp()
        {
         // Create a new Date object
         let currentTime = new Date();
          let myPara=(<div>
                <h1 className="Clock"> My Clock components</h1>
                <p>Current date and time are {currentTime.toLocaleString()}</p>
             </div>  );
           return myPara;
        }

       ReactDOM.render(<MyApp/>,document.querySelector("#root"));

    </script>
</body>
</html>
