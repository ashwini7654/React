<!DOCTYPE html>
<html lang="en">
<head>
     <title>JSX with Functions</title>
    <script 
    crossorigin src="https://unpkg.com/react@18/umd/react.development.js">
</script>
<script 
crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
    h1 {
        color: red;
    }
</style>
</head>
<body>
  
    <div id="root">

    </div>
    <script type="text/babel">
        function MyApp()
        {
        function showMSG(){
            alert("Hello Allu Arjun Fans");
        }
          let myPara=(<div>
                <h1>Welcome  guys</h1>
                <p>Click the button to see the message</p>
                <button onClick={showMSG}>Click Me</button>
             </div>  );
           return myPara;
        }
        
   ReactDOM.render(<MyApp/>,document.querySelector("#root"));

    </script>
</body>
</html>
