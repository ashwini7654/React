<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My JSX App 3 updated of 2</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    //Rewrite the previous React component so that for even numbers it should display the number as well as the message It is an even number and for odd numbers it should just display the number

    <!-- Jb koi Even number ho toh It is Even number show hona chahiye but Odd number ho toh kujh nhi show krna  -->
    <div id="root"></div>
    <script type="text/babel">
      function getRandomNumber() {
        let arr = [10, 5, 7, 11, 34, 89, 65, 44, 58, 90];
        //logic to pick up a random number from the array and return
        let numberIndex = Math.floor(Math.random() * arr.length);
        return arr[numberIndex];

      
      }
      function MyApp() {
        let num = getRandomNumber();
       return(
        <div>
        <p>Number is {num}</p>
        {num % 2 === 0 && <small>It is <b>Even number</b></small>}
        </div>
       )
      }
      ReactDOM.render(<MyApp />, document.querySelector("#root"));

    </script>
  </body>
</html>
