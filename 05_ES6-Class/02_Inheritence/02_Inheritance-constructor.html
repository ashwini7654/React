<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance</title>
    <script>
        class Vehicle{
            constructor(){
                document.write("Vehicle created...<br>");
            }
            accelerate(){
                document.write("Vehicle is accelerating<br>");
            }
        }
        class Car extends Vehicle{
            reverse(){
                document.write("Car is reversing<br>");
            }
        }
        let audi = new Car();
        audi.accelerate();
        audi.reverse();
        // The constructor of the parent class is automatically called when a child class is instantiated, even if the child class does not have its own constructor defined.
    </script>
</head>
<body>
    
</body>
</html>
