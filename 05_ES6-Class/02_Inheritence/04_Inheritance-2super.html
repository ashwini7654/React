<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance</title>
    <script>
        class Vehicle{
            constructor(){
                document.write("Vehicle created...<br>");
            }
            accelerate(){
                document.write("Vehicle is accelerating<br>");
            }
        }
        class Car extends Vehicle{
            constructor(){
                super(); 
                document.write("Car created...<br>");
                super(); 
                // two calls to super() in the constructor will throw an error because super() can only be called once in a derived class constructor.
            }
            reverse(){
                document.write("Car is reversing<br>");
            }
        }
        let audi = new Car();
        audi.accelerate();
        audi.reverse();
    </script>
</head>
<body>
    
</body>
</html>
