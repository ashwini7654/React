<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inheritance</title>
    <script>
        class Vehicle{
            constructor(){
                document.write("Vehicle created...<br>");
            }
            accelerate(){
                document.write("Vehicle is accelerating<br>");
            }
        }
        class Car extends Vehicle{
            constructor(){
  //without super() in the constructor of the child class, it will throw an error because the parent class constructor must be called before using 'this' in the child class constructor.              
                document.write("Car created...<br>");
               
            }
            reverse(){
                document.write("Car is reversing<br>");
            }
        }
        let audi = new Car();
        audi.accelerate();
        audi.reverse();
    </script>
</head>
<body>
    
</body>
</html>
