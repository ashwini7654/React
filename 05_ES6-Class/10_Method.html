<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Example</title>
    <script>
        // this will give undefined because constructor ke andar  always this lga kr property bnneyege this or var se noramal varible bnnte h
        class Emp
        {
     constructor(id,name,sal){
      this.id=id;
      this.name=name;
      this.sal=sal;
        }
        raiseSalary(){
            this.sal=this.sal +this.sal*0.1;
        }
    }
        let e1= new Emp(101,"ashwini",20000);
        document.write(`id:${e1.id},name:${e1.name},sal:${e1.sal}`);
        let e2= new Emp(102,"raj",30000);
        document.writeg(`id:${e2.id},name:${e2.name},sal:${e2.sal}`);
        e1.raiseSalary();
        e2.raiseSalary();
        document.write("After Increment");
        document.write(`id:${e1.id},name:${e1.name},sal:${e1.sal}`);
        document.writeg(`id:${e2.id},name:${e2.name},sal:${e2.sal}`);

    </script>
