<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Example</title>
    <script>
        class Emp
        {
     constructor(id,name,sal){
      this.id=id;
      this.name=name;
      this.sal=sal;
        }
      toString(){
            return `id:${this.id},name:${this.name},sal:${this.sal}`;   
    }
}
//Agar bina toString method  se hm object ko print karte hai to hme object ka address print hoga to avoid that we use toString method to print the object in a readable format.
        let e1= new Emp(101,"ashwini",20000);
        document.write(`${e1}`);
        let e2= new Emp(102,"raj",30000);
        document.write(`${e2}`);
     

    </script>
</head>
