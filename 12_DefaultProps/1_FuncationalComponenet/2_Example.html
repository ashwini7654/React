<!DOCTYPE html>
<html lang="en">
<head>
     <title>MyDefault props React Application using desturcturing</title>
    <script 
    crossorigin src="https://unpkg.com/react@18/umd/react.development.js">
</script>
<script 
crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root">

    </div>
    <script type="text/babel">
        function Greeting({ who="Everyone",from="Team Sca"})
        {
       
       return (
        <h1>Happy New year to {who} from {from}</h1>
       )
      }
        let root = ReactDOM.createRoot(document.querySelector("#root"));
        root.render(<Greeting   />);

    </script>
</body>
</html>
