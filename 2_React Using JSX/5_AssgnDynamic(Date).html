<!DOCTYPE html>
<html lang="en">
<head>
     <title>My  React With JSX Application to Dispaly Current Date and Time</title>
    <script 
    crossorigin src="https://unpkg.com/react@18/umd/react.development.js">
</script>
<script 
crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  
    <div id="root">

    </div>
    <script type="text/babel">
        function MyApp()
        {
         // Create a new Date object
         let currentTime = new Date();
          let myDiv=(<div>
                <p>Current date and time are {currentTime.toString()}</p>
               </div>);
           return myDiv;
        }
    
  
       ReactDOM.render(<MyApp/>,document.querySelector("#root"));

    </script>
</body>
</html>
