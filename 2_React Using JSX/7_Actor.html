<!DOCTYPE html>
<html lang="en">
<head>
     <title>My  React With JSX Application Actor</title>
    <script 
    crossorigin src="https://unpkg.com/react@18/umd/react.development.js">
</script>
<script 
crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  
    <div id="root">

    </div>
    <script type="text/babel">
        function MyApp()
        {
             let actor={name:"Allu Arjun",hit:"Pushpa 2"}
       
          let myDiv=(<div>
                <p>Famous movie is {actor}</p>
               </div>);
           return myDiv;
        }
    
        ReactDOM.render(<MyApp/>,document.querySelector("#root"));


    </script>
</body>
</html>
