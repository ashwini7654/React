<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My JSX App using shorcircuit 1</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
        <!-- Jb koi Even number ho toh It is Even number show hona chahiye but Odd number ho toh kujh nhi show krna  -->

    <div id="root"></div>
    <script type="text/babel">
      function getRandomNumber() {
        let arr = [10, 5, 7, 11, 34, 89, 65, 44, 58, 90];
        //logic to pick up a random number from the array and return
        let numberIndex = Math.floor(Math.random() * arr.length);
        return arr[numberIndex];

        //hint: Math.floor() and Math.random()
      }
      function MyApp() {
        let num = getRandomNumber();
     
 let myDiv =(
          <div>
            <p>Number is {num}</p>
            {num % 2 === 0 &&<small>It is Even number</small>} 
          </div>
        );
        // Shortcircuit resolution mai && operator  ye khta h ki && ke phle wla logical operator true hoga toh  && ke bd wla value chlegi agr phla false hu toh first wla value  hi chlegi
        return myDiv;
      }
      ReactDOM.render(<MyApp/>, document.querySelector("#root"));

    </script>
  </body>
</html>
