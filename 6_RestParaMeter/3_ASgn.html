<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkSheet</title>
    <script>
        function MarkSheet(name,...args){
            document.write(`Name of student${name}<br>`);
            let sum=0;
            args.forEach((m)=>{
                sum+=m;
            });
            document.write(`Total Marks ${sum}`)
            
        }
    </script>
</head>
