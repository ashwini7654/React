<!DOCTYPE html>
<html lang="en">
<head>
     <title>My First funcational props React Application</title>
    <script 
    crossorigin src="https://unpkg.com/react@18/umd/react.development.js">
</script>
<script 
crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
</script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root">

    </div>
    <script type="text/babel">
        function Greeting(props)
        {
         return <h1>Happy New year to {props.who} from {props.from}</h1>;
        }
    
        let root = ReactDOM.createRoot(document.querySelector("#root"));
        root.render(<Greeting who="Ashwini" from="Anisha" />);

    </script>
</body>
</html>
