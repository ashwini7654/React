<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Example 10</title>
    <script>
      class Emp {
        constructor(id,name,sal) {
          this.id = id;
          this.name = name;
          this.sal = sal;
        }
      }
      let e1 = new Emp(101,"Ankit",80000.0);
      console.log(`id:${e1.id},name:${e1.name},sal:${e1.sal}`);
      let e2 = new Emp(102,"Deepak",65000.0);
      console.log(`id:${e2.id},name:${e2.name},sal:${e2.sal}`);
    </script>
  </head>
  <body></body>
</html>
