<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Example 14</title>
    <script>
      class Emp {
        constructor(id, name, sal) {
          this.id = id;
          this.name = name;
          this.sal = sal;
        }
        toString() {
          return `id:${this.id},name:${this.name},sal:${this.sal}`;
        }
      }
      let e1 = new Emp(101, "Ankit", 80000.0);
      document.write(`${e1}<br>`);
      let e2 = new Emp(102, "Deepak", 65000.0);
      document.write(`${e2.toString()}<br>`);
    </script>
  </head>
  <body></body>
</html>
