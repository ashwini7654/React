<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Example 28</title>
    <script>
      class Person {
        constructor(age, fname, lname) {
          this.fname = fname;
          this.lname = lname;
          this._age = age;
        }
        get fullName() {
          return this.fname + " " + this.lname;
        }
        set fullName(name) {
          let arr = name.split(" ");
          this.fname = arr[0];
          this.lname = arr[1];
        }
        set age(x) {
          if (x < 0) {
            throw new Error("Invalid age!");
          }
          this._age = x;
        }
        get age() {
          return this._age;
        }
      }
      let p = new Person(34, "Sachin", "Kapoor");
      document.write(`${p.fullName},`);
      document.write(`${p.age}`);
      p.fullName = "Amit Kumar"; // p.setFullName("Amit Kumar")
      p.age = -25;
      document.write(`<br>${p.fullName}`);
      document.write(`${p.age}`);
    </script>
  </head>
  <body></body>
</html>
