<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Example 32</title>
    <script>
      class Emp {
        age = 21;
        name = "Deepak";
        #salary = 75000.0;
        show() {
          document.write(
            `age:${this.age},name:${this.name},sal:${this.#salary}`
          );
        }
      }
      let obj = new Emp();
      //console.log(obj);
      obj.show();
    </script>
  </head>
  <body></body>
</html>
