<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Example 3</title>
    <script>
      class Emp {
        id ;
        name ;
        sal ;
      }
      let e1 = new Emp();
      e1.id=101;
      e1.name="Ankit";
      e1.sal=80000.0;
      console.log(`id:${e1.id},name:${e1.name},sal:${e1.sal}`);
      let e2 = new Emp();
      e2.id=102;
      e2.name="Sumit";
      e2.sal=90000.0;
      console.log(`id:${e2.id},name:${e2.name},sal:${e2.sal}`);
    </script>
  </head>
  <body></body>
</html>
