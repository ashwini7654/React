<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Example 8</title>
    <script>
      class Emp {
        constructor() {
          this.id = 101;
          this.name = "Ankit";
          this.sal = 80000.0;
        }
      }
      let e1 = new Emp();
      console.log(`id:${e1.id},name:${e1.name},sal:${e1.sal}`);
      let e2 = new Emp();
      console.log(`id:${e2.id},name:${e2.name},sal:${e2.sal}`);
    </script>
  </head>
  <body></body>
</html>
