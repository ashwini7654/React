<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My Fourth React App</title>
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
        function MyApp(){
            let myElement = React.createElement("h1", null, "React Rocks!!!");
            return myElement;
        }
    
      let myDiv = document.querySelector("#root");
      let element=React.createElement(MyApp);
      ReactDOM.render(element, myDiv);
    </script>
  </body>
</html>
